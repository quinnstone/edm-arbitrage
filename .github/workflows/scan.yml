name: Ticket Arbitrage Scan

on:
  schedule:
    # Two staggered crons so each 15-min slot has two independent
    # trigger attempts ~7-8 min apart. GitHub Actions drops cron
    # triggers under load — having two crons effectively doubles the
    # odds any given window catches a scan.
    - cron: "0,15,30,45 * * * *"
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: # Allow manual triggers

# Serialize runs of this workflow. Scans take ~11 min and crons fire
# every 7-8 min, so two scans could overlap — each would restore the
# cache, run independently, and save back their pre-overlap snapshot,
# silently rolling back the other's state writes (position monitor's
# last_alert, spec digest's slot dedup, etc.). cancel-in-progress=false
# queues the second trigger instead of killing the first.
concurrency:
  group: ticket-arbitrage-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Restore tracking data
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: tracking-${{ github.run_id }}
          restore-keys: |
            tracking-

      - name: Run arbitrage scan
        env:
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py

      - name: Save tracking data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/
          key: tracking-${{ github.run_id }}
