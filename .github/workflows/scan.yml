name: Ticket Arbitrage Scan

on:
  schedule:
    # Two staggered */5 crons so each 5-min slot has two independent
    # trigger attempts ~2-3 min apart. With concurrency cancel-in-
    # progress=false, the second of any overlapping pair gets queued
    # (or canceled if a queued one already exists), so effective
    # cadence is bounded by scan duration (~5-6 min), not trigger
    # frequency — more triggers just churn through cancellations to
    # produce a successful scan whenever the runner pool can take one.
    # Trade-off: GHA may throttle */5 more than */15 under load. If
    # 48h of production data shows the throttle is worse than expected,
    # revert these to "0,15,30,45" + "7,22,37,52" and add an external
    # workflow_dispatch scheduler instead.
    - cron: "0,5,10,15,20,25,30,35,40,45,50,55 * * * *"
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch: # Allow manual triggers

# Serialize runs of this workflow. Scans take ~11 min and crons fire
# every 7-8 min, so two scans could overlap — each would restore the
# cache, run independently, and save back their pre-overlap snapshot,
# silently rolling back the other's state writes (position monitor's
# last_alert, spec digest's slot dedup, etc.). cancel-in-progress=false
# queues the second trigger instead of killing the first.
concurrency:
  group: ticket-arbitrage-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # 2026-08-25: raised from 35 — matcher takes
                         # 30+ min at current event volume (280+ active).
                         # 45 leaves ~8-10 min buffer for Skydeck +
                         # position monitor + alert send + spec digest.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Restore tracking data
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: tracking-${{ github.run_id }}
          restore-keys: |
            tracking-

      - name: Run arbitrage scan
        env:
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Unbuffered stdout so we can see the exact line before any hang.
          # Historical scans have gone silent for 19+ minutes with no
          # output — that's the buffer, not the process, being idle. This
          # makes hang points visible in real time.
          PYTHONUNBUFFERED: "1"
        run: python main.py

      - name: Save tracking data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/
          key: tracking-${{ github.run_id }}
