name: Ticket Radar

on:
  schedule:
    # Once daily at 15:00 UTC = 11am ET. Public-source promo codes and
    # availability changes don't move fast enough to warrant 6h scans;
    # one morning scan catches overnight changes and gives same-day
    # actioning headroom.
    - cron: "0 15 * * *"
  workflow_dispatch:

jobs:
  ticket-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore tracking data
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: tracking-${{ github.run_id }}
          restore-keys: |
            tracking-

      - name: Run ticket radar
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python ticket_radar.py

      - name: Save tracking data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/
          key: tracking-${{ github.run_id }}
