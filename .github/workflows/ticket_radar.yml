name: Ticket Radar

on:
  schedule:
    # Every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC.
    # Roughly 8pm/2am/8am/2pm ET — covers daytime + late-night drops.
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ticket-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore tracking data
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: tracking-${{ github.run_id }}
          restore-keys: |
            tracking-

      - name: Run ticket radar
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python ticket_radar.py

      - name: Save tracking data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/
          key: tracking-${{ github.run_id }}
