name: Seated Venue Scan

on:
  schedule:
    # Run every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch: # Allow manual triggers

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      # Separate cache namespace from scan.yml. The two workflows write
      # disjoint files in data/ (seated_scanner only touches
      # seated_spec_sent.json), but cache save snapshots the entire
      # directory — sharing a key prefix would let each workflow revert
      # the other's updates.
      - name: Restore tracking data
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: seated-tracking-${{ github.run_id }}
          restore-keys: |
            seated-tracking-

      - name: Run seated venue scan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python seated_scanner.py

      - name: Save tracking data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/
          key: seated-tracking-${{ github.run_id }}
